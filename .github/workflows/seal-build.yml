name: seal-build

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nvm
        run: curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash

      - name: Pack the tarball with the release-era Node 10 / npm 6
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 10
          nvm use 10
          node --version
          npm --version
          mkdir -p dist
          npm pack
          mv tar-4.4.8.tgz dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: tar-tgz
          path: dist/tar-4.4.8.tgz
          if-no-files-found: error
